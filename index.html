<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Michael Yoto Maker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1014">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <rect x="2.5" y="2.5" width="27" height="27" rx="7" stroke="currentColor" stroke-width="2.2"/>
          <circle cx="16" cy="13" r="4.6" stroke="currentColor" stroke-width="2.2"/>
          <path d="M8 26c1.6-4 4.2-6 8-6s6.4 2 8 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brandtext">
        <div class="name">Michael Yoto Maker</div>
        <div class="sub">Sticker sheet studio</div>
      </div>
    </div>

    <div class="proj">
      <input id="projectName" class="proj-name" value="Untitled sheet" spellcheck="false" autocomplete="off">
      <span id="saveState" class="save-state">Saved</span>
    </div>

    <div class="top-actions">
      <button class="btn find-btn" id="btnFind" title="Find an audiobook and turn it into a card">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 3v10.5M12 13.5a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v4.5a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M6.5 10.5v.5a5.5 5.5 0 0 0 11 0v-.5M12 16.5V21M9 21h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Find audio
      </button>
      <div class="divider"></div>
      <button class="btn" id="btnNew" title="New sheet">New</button>
      <button class="btn" id="btnOpen" title="Open a .mym project">Open</button>
      <button class="btn" id="btnSave" title="Save project file (Ctrl+S)">Save</button>
      <button class="btn primary" id="btnExport" title="Export print-ready file">Export…</button>
      <div class="divider"></div>
      <button class="iconbtn" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4.5 12H14a5.5 5.5 0 0 1 0 11h-2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="iconbtn" id="btnRedo" title="Redo (Ctrl+Y)" aria-label="Redo">
        <svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M19.5 12H10a5.5 5.5 0 0 0 0 11h2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="divider"></div>
      <div class="zoomctl">
        <button class="iconbtn" id="btnZoomOut" title="Zoom out (Ctrl+-)">
          <svg viewBox="0 0 24 24"><path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="zoomval" id="zoomLabel" title="Reset zoom to fit (Ctrl+0)">100%</button>
        <button class="iconbtn" id="btnZoomIn" title="Zoom in (Ctrl++)">
          <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="iconbtn" id="btnZoomFit" title="Fit page (Ctrl+0)">
          <svg viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button class="iconbtn" id="btnHelp" title="Help & shortcuts">?</button>
    </div>
  </header>

  <main>
    <nav id="toolbar" aria-label="Tools">
      <button class="tool active" data-tool="select" title="Select &amp; move (V)">
        <svg viewBox="0 0 24 24"><path d="M5.4 3.6 19 11.2c.8.4.7 1.6-.2 1.8l-5.3 1.5-2.4 5.1c-.4.9-1.6.8-1.9-.1L4.1 4.7c-.2-.8.6-1.5 1.3-1.1Z" fill="currentColor"/></svg>
        <span>Select</span>
      </button>
      <button class="tool" data-tool="text" title="Add text (T)">
        <svg viewBox="0 0 24 24"><path d="M4 6V4h16v2M12 4v16M8.5 20h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Text</span>
      </button>
      <button class="tool" data-tool="image" title="Add image (I)">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="m5 18 5-5 3.5 3.5L16.5 13l2.8 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
        <span>Image</span>
      </button>
      <button class="tool" data-tool="shape" title="Add shape (R)">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>Shape</span>
      </button>
      <div class="tool-sep"></div>
      <button class="tool small" id="btnGuides" title="Toggle card outlines (G)">
        <svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-dasharray="3 2.4"/></svg>
        <span>Outlines</span>
      </button>
      <button class="tool small" id="btnNumbers" title="Toggle card numbers">
        <svg viewBox="0 0 24 24"><path d="M9 8h2v8M8 16h4M15 8h2v8M14 16h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Numbers</span>
      </button>
    </nav>

    <section id="stagewrap">
      <canvas id="stage"></canvas>
      <div id="stageHint" class="stage-hint"></div>
      <div id="textEditorWrap" class="text-editor-wrap hidden">
        <textarea id="textEditor" spellcheck="false"></textarea>
      </div>
      <div id="dropHint" class="drop-hint hidden">Drop image on a card</div>
      <div id="marquee" class="marquee hidden"></div>
    </section>

    <aside id="sidebar">
      <div class="side-section" id="cardsSection">
        <div class="side-head">
          <span>Cards</span>
          <span class="muted" id="cardCount">0</span>
        </div>
        <div id="cardNav" class="card-nav"></div>
      </div>
      <div class="side-section grow" id="inspectorSection">
        <div class="side-head">
          <span id="inspectorTitle">Page setup</span>
          <button class="linkbtn" id="btnPageSetup" title="Page setup">Layout…</button>
        </div>
        <div id="inspector"></div>
      </div>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="statusHint">Click a card to start designing</span>
    <span id="statusRight"></span>
  </footer>
</div>

<input type="file" id="fileImage" accept="image/*" hidden multiple>
<input type="file" id="fileProject" accept=".mym,.json,application/json" hidden>
<input type="file" id="fileFont" accept=".ttf,.otf,.woff,.woff2" hidden>
<div id="toasts" class="toasts"></div>
<div id="modalRoot"></div>

<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/render.js"></script>
<script src="js/pdf.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/library.js"></script>
<script src="js/app.js"></script>
</body>
</html>
